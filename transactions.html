<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transactions | RM Wallet</title>
<meta name="description" content="Searchable and filterable list of all income and expense transactions.">
<meta name="author" content="RM Wallet – IMS566 Individual Project">
<meta name="keywords" content="personal finance, budget tracker, student expenses, Bootstrap 5, Chart.js">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="nav"></div>
<main class="container py-4">
  <header class="mb-4"><h1 class="h2 mb-1">Transactions</h1><p class="text-secondary mb-0">Search and filter every ringgit in and out.</p></header>
  <section class="panel">
    <div class="row g-2 mb-3">
      <div class="col-md-5"><input id="q" class="form-control" placeholder="Search description" aria-label="Search description"></div>
      <div class="col-6 col-md-3"><select id="fType" class="form-select" aria-label="Type"><option value="">All types</option><option>income</option><option>expense</option></select></div>
      <div class="col-6 col-md-4"><select id="fCat" class="form-select" aria-label="Category"><option value="">All categories</option></select></div>
    </div>
    <div class="table-responsive"><table class="table table-hover align-middle">
      <thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Type</th><th class="text-end">Amount</th></tr></thead>
      <tbody id="rows"></tbody></table></div>
    <p id="count" class="small text-secondary mb-0"></p>
  </section>
</main>
<div id="foot"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script><script src="js/app.js"></script>
<script>
renderShell('transactions');
const $=id=>document.getElementById(id);
[...new Set(TRANSACTIONS.map(t=>t.cat))].sort().forEach(c=>$('fCat').insertAdjacentHTML('beforeend',`<option>${c}</option>`));
function draw(){
  const q=$('q').value.toLowerCase(), ty=$('fType').value, ca=$('fCat').value;
  const list=TRANSACTIONS.filter(t=>t.desc.toLowerCase().includes(q)&&(!ty||t.type===ty)&&(!ca||t.cat===ca)).sort((a,b)=>b.date.localeCompare(a.date));
  $('rows').innerHTML=list.length?list.map(t=>`<tr><td>${t.date}</td><td>${t.desc}</td><td>${t.cat}</td>
   <td><span class="badge rounded-pill badge-${t.type}">${t.type}</span></td>
   <td class="text-end ${t.type==='income'?'amt-in':'amt-out'}">${t.type==='income'?'+':'-'}${rm(t.amount)}</td></tr>`).join('')
   :'<tr><td colspan="5" class="text-center text-secondary py-4">No transactions match. Clear a filter to see more.</td></tr>';
  $('count').textContent=list.length+' of '+TRANSACTIONS.length+' transactions';
}
['q','fType','fCat'].forEach(i=>$(i).addEventListener('input',draw)); draw();
</script>
</body></html>
