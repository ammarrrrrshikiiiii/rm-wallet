<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
<meta name="theme-color" content="#10302f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<title>Expenses | RM Wallet</title>
<meta name="description" content="Monthly expense breakdown with a donut chart, category summary and merchant view.">
<meta name="author" content="RM Wallet">
<meta name="keywords" content="personal finance, budget tracker, student expenses, Bootstrap 5, Chart.js">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="nav"></div>
<main class="container py-4">
  <header class="mb-3"><h1 class="h2 mb-1">Expenses</h1><p class="text-secondary mb-0" id="sub">Where your money went this month.</p></header>

  <nav class="month-tabs mb-3" id="monthTabs" aria-label="Month selector"></nav>

  <section class="panel mb-4">
    <div class="d-flex justify-content-between align-items-start mb-2">
      <h2 class="h5 mb-0">Spent so far</h2>
      <span class="badge rounded-pill badge-source" id="momPill"></span>
    </div>
    <div class="donut-wrap"><canvas id="cExpense" role="img" aria-label="Donut chart of monthly expenses by category"></canvas>
      <div class="donut-center">
        <div class="dc-label">Spent so far</div>
        <div class="dc-value" id="spentTotal">&mdash;</div>
      </div>
    </div>
  </section>

  <div class="d-flex flex-wrap gap-2 mb-3">
    <button id="addExpenseBtn" class="btn btn-teal" type="button"><i class="bi bi-plus-lg me-1"></i>Add Expense</button>
    <button id="filterBtn" class="btn btn-outline-secondary" type="button"><i class="bi bi-funnel me-1"></i>Filter</button>
  </div>

  <div class="subnav" role="tablist" aria-label="Expense views">
    <button type="button" class="active" data-tab="latest" role="tab" aria-selected="true">Latest</button>
    <button type="button" data-tab="categories" role="tab" aria-selected="false">Categories</button>
    <button type="button" data-tab="merchants" role="tab" aria-selected="false">Merchants</button>
  </div>

  <section class="category-strip mb-4" id="catStrip" aria-label="Spending by category"></section>

  <section id="pane-latest">
    <div class="row g-2 mb-3" id="filterRow">
      <div class="col-md-5"><input id="q" class="form-control" placeholder="Search description" aria-label="Search description"></div>
      <div class="col-6 col-md-4"><select id="fCat" class="form-select" aria-label="Category"><option value="">All categories</option></select></div>
      <div class="col-6 col-md-3"><select id="fSource" class="form-select" aria-label="Payment source"><option value="">All sources</option></select></div>
    </div>
    <div class="d-flex flex-wrap gap-2 mb-3">
      <button id="expJSON" class="btn btn-sm btn-outline-secondary" type="button"><i class="bi bi-download me-1"></i>Export JSON</button>
      <button id="expCSV" class="btn btn-sm btn-outline-secondary" type="button"><i class="bi bi-filetype-csv me-1"></i>Export CSV</button>
      <button id="impBtn" class="btn btn-sm btn-outline-secondary" type="button"><i class="bi bi-upload me-1"></i>Import</button>
      <input type="file" id="impFile" accept=".json,.csv,application/json,text/csv" hidden>
      <span id="backupMsg" class="small text-secondary align-self-center" aria-live="polite"></span>
    </div>
    <div class="panel">
      <div class="table-responsive"><table class="table table-hover align-middle">
        <thead><tr><th scope="col">Date</th><th scope="col">Description</th><th scope="col">Category</th><th scope="col">Source</th><th scope="col" class="text-end">Amount</th></tr></thead>
        <tbody id="rows"></tbody></table></div>
      <p id="count" class="small text-secondary mb-0"></p>
    </div>
  </section>

  <section id="pane-categories" class="d-none panel">
    <div id="catBreakdown" aria-label="Category breakdown"></div>
  </section>

  <section id="pane-merchants" class="d-none panel">
    <div id="merchantBreakdown" aria-label="Merchant breakdown"></div>
  </section>
</main>
<div id="foot"></div>

<div class="modal fade" id="addExpenseModal" tabindex="-1" aria-labelledby="addExpenseTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header"><h2 class="modal-title h5" id="addExpenseTitle">Add expense</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body">
        <div class="mb-3"><label class="form-label" for="aeAmount">Amount (RM)</label><input id="aeAmount" class="form-control" inputmode="decimal" placeholder="0.00"></div>
        <div class="mb-3"><label class="form-label" for="aeNote">Note</label><input id="aeNote" class="form-control" placeholder="e.g. Mamak dinner"></div>
        <div class="mb-3"><label class="form-label" for="aeCat">Category</label><select id="aeCat" class="form-select"></select></div>
        <div class="mb-3"><label class="form-label" for="aeSource">Payment source</label><select id="aeSource" class="form-select"></select></div>
        <div id="aeHint" class="small text-secondary" aria-live="polite"></div>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button id="aeSave" type="button" class="btn btn-teal">Add expense</button></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js" integrity="sha384-JUh163oCRItcbPme8pYnROHQMC6fNKTBWtRG3I3I0erJkzNgL7uxKlNwcrcFKeqF" crossorigin="anonymous"></script>
<script type="module" src="js/pwa.js"></script>
<script type="module" src="js/transactions.js"></script>
</body>
</html>
