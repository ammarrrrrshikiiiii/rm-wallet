<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard | RM Wallet</title>
<meta name="description" content="Overview of income, spending, balance and savings rate with charts of monthly trends and spending by category.">
<meta name="author" content="RM Wallet – IMS566 Individual Project">
<meta name="keywords" content="personal finance, budget tracker, student expenses, Bootstrap 5, Chart.js">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="nav"></div>
<main class="container py-4">
  <header class="mb-4"><h1 class="h2 mb-1">Dashboard</h1><p class="text-secondary mb-0" id="sub"></p></header>
  <section class="row g-3 mb-4" aria-label="Summary">
    <div class="col-12 col-md-6 col-lg-3"><div class="panel stat-main h-100"><div class="stat-label">Balance (Jun–Nov)</div><div class="stat-value" id="sBal"></div></div></div>
    <div class="col-6 col-lg-3"><div class="panel h-100"><div class="stat-label">Income this month</div><div class="stat-value amt-in" id="sInc"></div></div></div>
    <div class="col-6 col-lg-3"><div class="panel h-100"><div class="stat-label">Spent this month</div><div class="stat-value amt-out" id="sExp"></div></div></div>
    <div class="col-12 col-lg-3"><div class="panel h-100"><div class="stat-label">Savings rate (this month)</div><div class="stat-value" id="sRate"></div></div></div>
  </section>
  <section class="row g-3">
    <div class="col-lg-7"><div class="panel"><h2 class="h5">Income vs expenses by month</h2><div class="chart-box"><canvas id="cMonth"></canvas></div></div></div>
    <div class="col-lg-5"><div class="panel"><h2 class="h5">Where this month's money went</h2><div class="chart-box"><canvas id="cCat"></canvas></div></div></div>
    <div class="col-12"><div class="panel"><h2 class="h5">Latest transactions</h2>
      <div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Date</th><th>Description</th><th>Category</th><th class="text-end">Amount</th></tr></thead><tbody id="recent"></tbody></table></div>
      <a href="transactions.html" class="btn btn-sm btn-teal mt-3">View all transactions</a></div></div>
  </section>
</main>
<div id="foot"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="js/data.js"></script><script src="js/app.js"></script>
<script>
renderShell('dashboard');
const cur=TRANSACTIONS.filter(t=>t.date.startsWith(CURRENT_MONTH)), all=totals(TRANSACTIONS), m=totals(cur);
document.getElementById('sub').textContent='Welcome back, '+sessionStorage.getItem('rmUser')+'. Here is your November 2026 snapshot.';
document.getElementById('sBal').textContent=rm(all.balance);
document.getElementById('sInc').textContent=rm(m.income);
document.getElementById('sExp').textContent=rm(m.expense);
document.getElementById('sRate').textContent=Math.round(m.balance/m.income*100)+'%';

// Chart 1: income vs expense per month (grouped bar)
const months=[...new Set(TRANSACTIONS.map(t=>t.date.slice(0,7)))];
new Chart('cMonth',{type:'bar',data:{labels:months.map(monthName),datasets:[
 {label:'Income',backgroundColor:'#1f7a6d',data:months.map(x=>totals(TRANSACTIONS.filter(t=>t.date.startsWith(x))).income)},
 {label:'Expenses',backgroundColor:'#e0604a',data:months.map(x=>totals(TRANSACTIONS.filter(t=>t.date.startsWith(x))).expense)}]},
 options:{responsive:true,maintainAspectRatio:false,scales:{y:{ticks:{callback:v=>'RM '+v}}},plugins:{tooltip:{callbacks:{label:c=>c.dataset.label+': '+rm(c.raw)}}}}});

// Chart 2: current month spending by category (doughnut)
const cats={}; cur.filter(t=>t.type==='expense').forEach(t=>cats[t.cat]=(cats[t.cat]||0)+t.amount);
new Chart('cCat',{type:'doughnut',data:{labels:Object.keys(cats),datasets:[{data:Object.values(cats),backgroundColor:PALETTE}]},
 options:{responsive:true,maintainAspectRatio:false,cutout:'60%',plugins:{legend:{position:'bottom'},tooltip:{callbacks:{label:c=>c.label+': '+rm(c.raw)}}}}});

// Latest 5 transactions
document.getElementById('recent').innerHTML=[...TRANSACTIONS].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5).map(t=>
 `<tr><td>${t.date}</td><td>${t.desc}</td><td>${t.cat}</td><td class="text-end ${t.type==='income'?'amt-in':'amt-out'}">${t.type==='income'?'+':'-'}${rm(t.amount)}</td></tr>`).join('');
</script>
</body></html>
