<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
<title>Dashboard | RM Wallet</title>
<meta name="description" content="Overview of income, spending, balance and savings rate with charts of monthly trends and spending by category.">
<meta name="author" content="RM Wallet">
<meta name="keywords" content="personal finance, budget tracker, student expenses, Bootstrap 5, Chart.js">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="nav"></div>
<main class="container py-4">
  <header class="mb-4"><h1 class="h2 mb-1">Dashboard</h1><p class="text-secondary mb-0" id="sub"></p></header>
  <section class="row g-3 mb-4" aria-label="Summary">
    <div class="col-12 col-md-6 col-lg-3"><div class="panel stat-main h-100"><div class="stat-label" id="sBalLabel">Balance</div><div class="stat-value" id="sBal"></div></div></div>
    <div class="col-6 col-lg-3"><div class="panel h-100"><div class="stat-label" id="sIncLabel">Income</div><div class="stat-value amt-in" id="sInc"></div></div></div>
    <div class="col-6 col-lg-3"><div class="panel h-100"><div class="stat-label" id="sExpLabel">Spent</div><div class="stat-value amt-out" id="sExp"></div></div></div>
    <div class="col-12 col-lg-3"><div class="panel h-100"><div class="stat-label" id="sRateLabel">Savings rate</div><div class="stat-value" id="sRate"></div></div></div>
  </section>
  <section class="row g-3">
    <div class="col-lg-7"><div class="panel"><h2 class="h5">Income vs expenses by month</h2><div class="chart-box"><canvas id="cMonth" role="img" aria-label="Bar chart of income versus expenses by month"></canvas></div></div></div>
    <div class="col-lg-5"><div class="panel"><h2 class="h5">Where this month's money went</h2><div class="chart-box"><canvas id="cCat" role="img" aria-label="Doughnut chart of spending by category for the latest month"></canvas></div></div></div>
    <div class="col-12"><div class="panel"><h2 class="h5">Latest transactions</h2>
      <div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th scope="col">Date</th><th scope="col">Description</th><th scope="col">Category</th><th scope="col" class="text-end">Amount</th></tr></thead><tbody id="recent"></tbody></table></div>
      <a href="transactions.html" class="btn btn-sm btn-teal mt-3">View all transactions</a></div></div>
  </section>
</main>
<div id="foot"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js" integrity="sha384-JUh163oCRItcbPme8pYnROHQMC6fNKTBWtRG3I3I0erJkzNgL7uxKlNwcrcFKeqF" crossorigin="anonymous"></script>
<script type="module" src="js/dashboard.js"></script>
</body>
</html>
