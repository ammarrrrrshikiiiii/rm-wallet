<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
<meta name="theme-color" content="#10302f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<title>Budgets | RM Wallet</title>
<meta name="description" content="Monthly budget limits compared with actual spending for each category.">
<meta name="author" content="RM Wallet">
<meta name="keywords" content="personal finance, budget tracker, student expenses, Bootstrap 5, Chart.js">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="nav"></div>
<main class="container py-4">
  <header class="mb-4 d-flex justify-content-between align-items-start gap-2">
    <div><h1 class="h2 mb-1">Budgets</h1><p class="text-secondary mb-0" id="budgetSub">Monthly spending against your limits.</p></div>
    <button id="editBudgets" class="btn btn-outline-secondary btn-sm" type="button"><i class="bi bi-pencil me-1"></i>Edit budgets</button>
  </header>
  <section class="row g-3 mb-4" id="cards" aria-label="Budget categories"></section>
  <section class="row g-3">
    <div class="col-lg-7" id="chartWrap"><div class="panel"><h2 class="h5">Budget vs actual</h2><div class="chart-box"><canvas id="cBud" role="img" aria-label="Bar chart of budget limit versus actual spending by category"></canvas></div></div></div>
    <div class="col-lg-5"><div class="panel"><h2 class="h5">Budget table</h2><div class="table-responsive"><table class="table align-middle mb-0">
      <thead><tr><th scope="col">Category</th><th scope="col" class="text-end">Limit</th><th scope="col" class="text-end">Spent</th><th scope="col" class="text-end">Left</th></tr></thead><tbody id="tb"></tbody></table></div></div></div>
  </section>
</main>
<div id="foot"></div>

<div class="modal fade" id="budgetModal" tabindex="-1" aria-labelledby="budgetModalTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
    <div class="modal-header"><h2 class="modal-title h5" id="budgetModalTitle">Edit budgets</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
    <div class="modal-body">
      <p class="text-secondary small mb-3">Set a monthly limit per category. Leave 0 or empty to remove it.</p>
      <div id="budgetEditor"></div>
    </div>
    <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button id="budgetSave" type="button" class="btn btn-teal">Save budgets</button></div>
  </div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js" integrity="sha384-JUh163oCRItcbPme8pYnROHQMC6fNKTBWtRG3I3I0erJkzNgL7uxKlNwcrcFKeqF" crossorigin="anonymous"></script>
<script type="module" src="js/pwa.js"></script>
<script type="module" src="js/budgets.js"></script>
</body>
</html>
