<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Budgets | RM Wallet</title>
<meta name="description" content="Monthly budget limits compared with actual spending for each category.">
<meta name="author" content="RM Wallet – IMS566 Individual Project">
<meta name="keywords" content="personal finance, budget tracker, student expenses, Bootstrap 5, Chart.js">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="nav"></div>
<main class="container py-4">
  <header class="mb-4"><h1 class="h2 mb-1">Budgets</h1><p class="text-secondary mb-0">November 2026: spending against your monthly limits.</p></header>
  <section class="row g-3 mb-4" id="cards" aria-label="Budget categories"></section>
  <section class="row g-3">
    <div class="col-lg-7"><div class="panel"><h2 class="h5">Budget vs actual</h2><div class="chart-box"><canvas id="cBud"></canvas></div></div></div>
    <div class="col-lg-5"><div class="panel"><h2 class="h5">Budget table</h2><div class="table-responsive"><table class="table align-middle mb-0">
      <thead><tr><th>Category</th><th class="text-end">Limit</th><th class="text-end">Spent</th><th class="text-end">Left</th></tr></thead><tbody id="tb"></tbody></table></div></div></div>
  </section>
</main>
<div id="foot"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="js/data.js"></script><script src="js/app.js"></script>
<script>
renderShell('budgets');
// Spent per category this month
const spent=c=>TRANSACTIONS.filter(t=>t.type==='expense'&&t.cat===c&&t.date.startsWith(CURRENT_MONTH)).reduce((s,t)=>s+t.amount,0);
const data=BUDGETS.map(b=>({...b,spent:spent(b.cat),pct:Math.round(spent(b.cat)/b.limit*100)}));
const col=p=>p>100?'bg-danger':p>=80?'bg-warning':'bg-success';
document.getElementById('cards').innerHTML=data.map(d=>`<div class="col-sm-6 col-lg-4"><div class="panel h-100">
  <div class="d-flex justify-content-between"><h3 class="h6 mb-2">${d.cat}</h3><span class="small ${d.pct>100?'amt-out':'text-secondary'}">${d.pct}%</span></div>
  <div class="progress mb-2" role="progressbar" aria-valuenow="${Math.min(d.pct,100)}" aria-valuemin="0" aria-valuemax="100"><div class="progress-bar ${col(d.pct)}" style="width:${Math.min(d.pct,100)}%"></div></div>
  <div class="small text-secondary">${rm(d.spent)} of ${rm(d.limit)}${d.pct>100?' · over by '+rm(d.spent-d.limit):''}</div></div></div>`).join('');
document.getElementById('tb').innerHTML=data.map(d=>`<tr><td>${d.cat}</td><td class="text-end">${rm(d.limit)}</td><td class="text-end">${rm(d.spent)}</td><td class="text-end ${d.limit-d.spent<0?'amt-out':'amt-in'}">${rm(d.limit-d.spent)}</td></tr>`).join('');
new Chart('cBud',{type:'bar',data:{labels:data.map(d=>d.cat),datasets:[
 {label:'Limit',backgroundColor:'#d9efe8',data:data.map(d=>d.limit)},
 {label:'Spent',backgroundColor:data.map(d=>d.pct>100?'#e0604a':'#1f7a6d'),data:data.map(d=>d.spent)}]},
 options:{responsive:true,maintainAspectRatio:false,scales:{y:{ticks:{callback:v=>'RM '+v}}},plugins:{tooltip:{callbacks:{label:c=>c.dataset.label+': '+rm(c.raw)}}}}});
</script>
</body></html>
